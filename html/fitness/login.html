<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - Fitness - Personal Super App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/fitness/css/styles.css" />
  <link rel="stylesheet" href="/static/styles/nav.css" />
  <script>
    (function () {
      var theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div id="site-nav"></div>
  <script src="/static/js/nav.js"></script>
  <a class="back-link" href="/">&larr; Personal Super App</a>

  <main class="login-layout">
    <section class="card login-card">
      <h1>Personal Health</h1>
      <p>Sign in with the Google account your Fitbit/Google Health data lives under.</p>
      <a class="btn-primary" id="signin" href="/fitness/auth/start">Continue with Google</a>
      <p id="login-error" class="status status-error" role="status"></p>
    </section>
  </main>

  <script type="module" src="/static/fitness/js/login.js"></script>
</body>
</html>
