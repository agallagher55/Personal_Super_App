<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weight — Personal Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/fitness/css/styles.css" />
  <link rel="stylesheet" href="/static/styles/nav.css" />
  <script>
    (function () {
      var theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div id="site-nav"></div>
  <script src="/static/js/nav.js"></script>
  <a class="back-link" href="/fitness">&larr; Dashboard</a>

  <header class="app-header" id="page-header"></header>

  <p id="status" class="status" role="status"></p>

  <div class="detail-layout">
    <div class="detail-main">
      <section class="card">
        <div class="unit-toggle" id="unit-toggle">
          <button type="button" data-unit="kg">kg</button>
          <button type="button" data-unit="lb">lb</button>
        </div>
        <canvas id="chart" class="detail-chart"></canvas>
      </section>

      <section class="card">
        <h2>Statistics</h2>
        <div id="stats"></div>
      </section>
    </div>

    <aside class="detail-side">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Date</th><th>Weight</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </aside>
  </div>

  <script type="module" src="/static/fitness/js/pages/weight.js"></script>
</body>
</html>
