<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food - Personal Super App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/styles.css" />
  <link rel="stylesheet" href="/static/styles/nav.css" />
  <link rel="stylesheet" href="/static/fitness/css/styles.css" />
  <script>
    (function () {
      var theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div id="site-nav"></div>
  <script src="/static/js/nav.js"></script>
  <div class="page page-fitness">
    <div class="sheet fitness-sheet">
      <a class="back-link fitness-back-link" href="/fitness">&larr; Dashboard</a>

      <header class="app-header" id="page-header"></header>

      <p id="status" class="status" role="status"></p>

      <div class="detail-layout">
        <div class="detail-main">
          <section class="card">
            <canvas id="chart" class="detail-chart"></canvas>
          </section>

          <section class="card">
            <h2>Daily averages</h2>
            <div id="stats"></div>
          </section>
        </div>

        <aside class="detail-side">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Calories</th>
                  <th>Carbs</th>
                  <th>Protein</th>
                  <th>Fat</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
  <script type="module" src="/static/fitness/js/pages/food.js"></script>
</body>
</html>
