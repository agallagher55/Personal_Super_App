<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Task - Personal Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles/styles.css">
<script>
  (function () {
    var theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
  <div class="page page-single">
    <div class="sheet form-sheet">
      <nav class="site-nav">
        <a href="/">Tasks</a>
        <a href="/tasks">Categories</a>
        <span class="current">+ New Task</span>
        <a href="/fitness">Fitness</a>
        <a href="/finance">Finance</a>
      </nav>

      <header>
        <div class="title">New Task</div>
      </header>

      <form method="POST" action="/tasks/new" class="task-form" id="task-form">
        <label class="field">
          <span class="field-label">Section</span>
          <select name="section" id="section-select" required>
            <option value="" disabled selected>Loading sections...</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Description</span>
          <input type="text" name="desc" required placeholder="What needs doing?">
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Ticket number</span>
            <input type="text" name="ticket_number" placeholder="e.g. TASK0329104">
          </label>

          <label class="field">
            <span class="field-label">Due date</span>
            <input type="date" name="due_date">
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Assignment group</span>
            <input type="text" name="assignment_group" placeholder="e.g. Data Services Support">
          </label>

          <label class="field">
            <span class="field-label">Requested by</span>
            <input type="text" name="requested_by" placeholder="e.g. Justin Chang">
          </label>
        </div>

        <label class="field">
          <span class="field-label">Note</span>
          <textarea name="note" placeholder="Any extra detail..."></textarea>
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Priority</span>
            <select name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Time estimate (hours)</span>
            <input type="number" name="time_estimate" min="0" step="0.5">
          </label>
        </div>

        <label class="field">
          <span class="field-label">Priority tag</span>
          <input type="text" name="flag_tag" placeholder="e.g. top priority, overdue">
        </label>

        <label class="field">
          <span class="field-label">Other tags</span>
          <input type="text" name="tags">
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Related files</span>
            <input type="text" name="related_files" placeholder="paths or links, comma-separated">
          </label>

          <label class="field">
            <span class="field-label">Parent task</span>
            <select name="parent_id" id="parent-select">
              <option value="">None</option>
            </select>
          </label>
        </div>

        <div class="field-row" id="work-type-fields" style="display: none;">
          <label class="field field-inline">
            <input type="radio" name="work_type" value="" checked>
            <span class="field-label">None</span>
          </label>

          <label class="field field-inline">
            <input type="radio" name="work_type" value="new-feature">
            <span class="field-label">New feature</span>
          </label>

          <label class="field field-inline">
            <input type="radio" name="work_type" value="schema-change">
            <span class="field-label">Schema change</span>
          </label>
        </div>

        <label class="field field-inline">
          <input type="checkbox" name="done" value="1">
          <span class="field-label">Already complete</span>
        </label>

        <button type="submit" class="submit-btn">Add Task</button>
      </form>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/new-task.js"></script>
</body>
</html>
