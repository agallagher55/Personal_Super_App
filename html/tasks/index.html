<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles/styles.css">
<link rel="stylesheet" href="/static/styles/nav.css">
<script>
  (function () {
    var theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
  <div id="site-nav"></div>
  <script src="/static/js/nav.js"></script>
  <div class="page page-tasks">
    <aside class="scratchpad-panel">
      <div class="scratchpad-header">
        <span class="scratchpad-label">Today's List</span>
        <button type="button" class="scratchpad-today-btn" id="scratchpad-today-btn">Today</button>
      </div>
      <div class="scratchpad-day-nav">
        <button type="button" class="scratchpad-nav-btn" id="scratchpad-prev-day"></button>
        <span class="scratchpad-date" id="scratchpad-date"></span>
        <button type="button" class="scratchpad-nav-btn" id="scratchpad-next-day"></button>
      </div>
      <textarea id="scratchpad-input" class="scratchpad-input" placeholder="Jot down anything for today..."></textarea>
      <div class="scratchpad-status" id="scratchpad-status"></div>
      <div class="scratchpad-actions">
        <button type="button" class="scratchpad-action-btn" id="scratchpad-carry-forward-btn">Carry forward</button>
        <div class="scratchpad-convert-row">
          <select id="scratchpad-convert-section" class="scratchpad-convert-select" aria-label="Section for the new task"></select>
          <button type="button" class="scratchpad-action-btn" id="scratchpad-convert-btn">Line &rarr; Task</button>
        </div>
      </div>
      <div class="scratchpad-convert-confirm" id="scratchpad-convert-confirm" hidden></div>
    </aside>

    <div class="sheet tasks-sheet">
      <nav class="site-nav">
        <span class="current">All Tasks</span>
        <a href="/tasks/categories">Categories</a>
        <a href="/tasks/new">+ New Task</a>
      </nav>

      <header>
        <div class="title" id="page-title">Personal Tasks</div>
        <div class="meta" id="page-meta">
          <span id="page-date"></span><br>
          ALEX GALLAGHER
        </div>
      </header>

      <a class="new-task-cta" id="new-task-cta" href="/tasks/new">+ New Task</a>

      <div class="sync-health" id="sync-health" role="status">ServiceNow · checking sync health…</div>

      <div class="task-search-wrap">
        <input type="text" id="task-search" class="task-search" placeholder="Search tasks..." autocomplete="off">
      </div>

      <nav class="task-view-bar" id="task-view-bar" aria-label="Task queue">
        <button type="button" class="task-view-pill active" data-view="all">All</button>
        <button type="button" class="task-view-pill" data-view="today">Today <span class="view-count" id="today-count"></span></button>
        <button type="button" class="task-view-pill" data-view="waiting">Waiting <span class="view-count" id="waiting-count"></span></button>
        <button type="button" class="task-view-pill" data-view="overdue">Overdue <span class="view-count" id="overdue-count"></span></button>
        <button type="button" class="task-view-pill" data-view="no-due-date">No due date</button>
      </nav>
      <div class="task-facet-bar" id="task-facet-bar" aria-label="Task filters"></div>
      <div class="task-view-empty" id="task-view-empty" role="status" hidden></div>

      <div class="added-banner" id="added-banner">Task added.</div>

      <div id="sections"></div>

      <div class="footnote" id="footnote-text"></div>
    </div>

    <aside class="completed-panel">
      <div class="completed-header" id="completed-header">
        <button type="button" class="completed-toggle" id="completed-toggle" aria-expanded="true" aria-controls="completed-body">
          <span class="section-arrow" id="completed-arrow" aria-hidden="true">&#9660;</span>
          <span class="section-label">Completed</span>
          <span class="section-count" id="completed-count"></span>
        </button>
      </div>
      <div class="completed-filter-bar" id="completed-filter-bar">
        <button type="button" class="completed-filter-pill active" data-filter="all">All</button>
      </div>

      <div class="completed-body" id="completed-body"></div>
    </aside>
  </div>

  <button type="button" id="save-changes-btn" class="save-changes-btn">Save Changes</button>
  <div id="save-status" class="save-status"></div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/script.js"></script>
</body>
</html>
