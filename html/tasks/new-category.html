<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Category - Personal Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles/styles.css">
<link rel="stylesheet" href="/static/styles/nav.css">
<script>
  (function () {
    var theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
  <div id="site-nav"></div>
  <script src="/static/js/nav.js"></script>
  <div class="page page-single">
    <div class="sheet form-sheet">
      <nav class="site-nav">
        <a href="/">All Tasks</a>
        <a href="/tasks">Categories</a>
        <span class="current">+ New Category</span>
      </nav>

      <header>
        <div class="title">New Category</div>
      </header>

      <form method="POST" action="/tasks/new-category" class="task-form" id="category-form">
        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" name="label" required placeholder="e.g. Home Projects">
        </label>

        <button type="submit" class="submit-btn">Add Category</button>
      </form>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
</body>
</html>
